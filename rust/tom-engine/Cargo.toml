[package]
name = "tom-engine"
version = "0.1.0"
edition = "2021"
authors = ["TOM Project"]
description = "Deterministic low-level nervous system and hardware telemetry engine for TOM"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1.0"
thiserror = "2.0"
sysinfo = "0.33"
nvml-wrapper = "0.10"
cpal = "0.15"

[dev-dependencies]
